plugins {
    id 'java-library'
}

group = 'io.pocat'

def baseVersion = findProperty('baseVersion') ?: '1.0.0'
def buildType = findProperty('buildType') ?: 'snapshot'

switch (buildType) {
    case 'release':
        version = baseVersion
        break

    case 'snapshot':
        version = "${baseVersion}-SNAPSHOT"
        break

    case 'nightly':
        version = "${baseVersion}-nightly.${new Date().format('yyyyMMdd-HHmmss')}"
        break

    default:
        throw new GradleException("Unknown buildType: ${buildType}")
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':pocat-resource-api')
    implementation 'org.mongodb:mongodb-driver-sync:5.11.1'
}